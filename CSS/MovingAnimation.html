<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            margin:30px 30px;
            height:400px;
        width:400px;
        position:static;
        background-color:rgb(207, 204, 171);
        border: 2px solid black;
        }
 div{
        height:100px;
        margin:10px 10px;
        width:100px;
        background-color:aqua;
        border: 2px solid black;

        /* use to move in all direction --> (static/ relative(T,R,B,L --> working) /fixed/sticky)*/
        position:relative;

        /* For animation name  */
        animation-name:example; 
        animation-duration:5s;
        animation-direction:forword;
        animation-delay:1s;

    }
    @keyframes example{
       0% {background-color:black; left:0px; top:0px;}
       25% {background-color:blueviolet; left:200px; top:0px;}
       50% {background-color:blue; left:200px; top:200px;} 
       75% {background-color:red; left:0px; top:200px;}
      100% {background-color:yellowgreen; left:0px; top:0px;} 
    }
    </style>
   
</head>
<body>
    <div class="box">
        <div>

        </div>

    </div>
    
</body>
</html>
