<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

      /*  Text Shadow --> only single color add */
        h1{
            text-shadow:8px  4px 6px white;
            background-color:black;
            color: white;
            height:auto;
            padding: 15px;
            width:150px;

            /* box shadow -> we can add multiple shadow color */

            box-shadow:2px 2px 5px red, 2px 2px 15px greenyellow,2px 2px 15px black,  8px 2px 10px yellow;
        }
        
    </style>
</head>
<body>

    
    
    <div>
        <h1>mahendra singh</h1>
    </div>
</body>
</html>
