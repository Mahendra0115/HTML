<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            height: 300px;
            width: 300px;
           
            border: 2px solid blue;
        }

        /* Animation Syntex */
        @keyframes example{
            from{ background-color:red;}
            to { background-color:yellow;}
        }
        /* inner div */
        .inner{
            height: 70px;
            width: 70px;
            margin:10px;
            animation-name: example;
            animation-duration:10s;
            border: 2px solid black;

        }
    </style>
</head>
<body>
    <div class="outer">
       outer
        <div class="inner">
          inner
        </div>
    </div>
   
</body>
</html>
